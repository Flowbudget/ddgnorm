        method: Eintragsweiser Abgleich mit Q3421 und Q3214.
        numbers:
          gemeinsame_eintraege_q3421: 1744
          entgegengesetzt_zu_q3421: 1730
          betragsgleich_zu_q3421: 1744
          gemeinsame_eintraege_q3214: 1744
