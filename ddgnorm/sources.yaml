    entries: 669
    identifier:
      type: pdb_chain
      columns: {pdb: WT_PDB, chain: Chain}
      status: verified
    mutation:
      column: PDB_Mut
      alternative_column: Seq_Mut
      layout: "wt_aa + Position + mut_aa, z. B. S11A"
      position_basis: pdb_numbering
      position_basis_status: verified
