# ddgnorm - curated convention table for public ddG datasets
#
# Target convention of this tool (see target below):
#   ddg_kcal_mol < 0  =  destabilizing
#   ddg_kcal_mol > 0  =  stabilizing
#   unit kcal/mol
#
# sign_factor is the factor a raw value is multiplied by to reach the target
# convention. +1 means the source already agrees, -1 means it is flipped.
#
# Every convention carries a "verified" block with method, date and numbers.
# Anything that could not be established this way carries status: unverified,
# and the loader warns for each such field.
#
# All checks were run on 2026-09-07 against the files under data/raw. The
# method and the numbers behind each decision are recorded per field below.

schema_version: 1

target:
  sign_convention: negative_destabilizing
  unit: kcal_per_mol
  columns:
    - source
    - protein_id
    - id_type
    - position
    - wt_aa
    - mut_aa
    - ddg_kcal_mol
    - ph
    - temperature
  temperature_unit: celsius
  notes: >-
    Temperature is unified to degrees Celsius because most sources report
    Celsius. Sources in Kelvin are converted (see temperature.unit per source).

# ---------------------------------------------------------------------------

sources:

  s2648:
    name: S2648
    version: "protddg-bench, retrieved 2026-09-07"
    reference: "Dehouck et al. 2009, Bioinformatics 25:2537"
    url: https://github.com/protddg-bench/protddg-bench/tree/master/S2648
    local_path: data/raw/protddg/s2648-10fold-split-0.json
    format: json_records
    entries: 2648
    identifier:
      type: pdb_chain
      column: PDB
      layout: "four character PDB code plus one chain character, e.g. 1A5EA"
      status: verified
    mutation:
      column: MUT
      layout: "wt_aa + position + mut_aa in one field, e.g. W15D"
      position_basis: pdb_numbering
      position_basis_status: unverified
      position_basis_note: >-
        The list comes from structure based work and spot checks agree with
        PDB numbering, but the source itself makes no statement about it.
    ddg:
      column: DDG
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Compared shared entries (PDB, position, wild type, mutant) against
          ThermoMutDB, whose convention is fixed independently by its own
          "effect" field.
        numbers:
          shared_entries_thermomutdb: 1599
          same_sign: 1510
          opposite_sign: 56
          median_magnitude_ratio: 1.000
          raw_distribution: "568 positive, 2046 negative, median -0.82"
    ph:
      column: pH
      status: verified
    temperature:
      column: T
      unit: celsius
      status: verified
      verified:
        date: 2026-09-07
        method: Value range inspected
        numbers: {min: 0.0, median: 25.0, max: 107.0}
    notes: >-
      The CLID field is a homology cluster label shipped with the dataset,
      with 113 distinct values. ddgnorm does not use it.

  q3421:
    name: Q3421
    version: "ThermoNet, retrieved 2026-09-07"
    reference: "Li et al. 2020, PLoS Comput Biol 16:e1008291"
    url: https://raw.githubusercontent.com/gersteinlab/ThermoNet/master/data/datasets/Q3421.txt
    local_path: data/raw/thermonet/Q3421.txt
    format: whitespace_table_with_header
    header_lines: 2
    entries: 3421
    identifier:
      type: pdb_chain
      columns: {pdb: 0, chain: 1}
      status: verified
    mutation:
      columns: {position: 2, wt_aa: 3, mut_aa: 4}
      position_basis: pdb_numbering
      position_basis_status: verified
      position_basis_note: >-
        The file carries Pos(PDB) and Position(I-TASSER) as separate columns.
        ddgnorm uses Pos(PDB).
    ddg:
      column: 5
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Compared shared entries against S2648, whose convention is
          established through ThermoMutDB.
        numbers:
          shared_entries_s2648: 1531
          same_sign: 1452
          opposite_sign: 57
    ph:
      column: 7
      status: verified
    temperature:
      column: 6
      unit: celsius
      status: verified
      verified:
        date: 2026-09-07
        method: Value range inspected
        numbers: {min: -8.0, median: 25.0, max: 107.0}

  q3214:
    name: Q3214
    version: "ThermoNet, retrieved 2026-09-07"
    reference: "Li et al. 2020, PLoS Comput Biol 16:e1008291"
    url: https://raw.githubusercontent.com/gersteinlab/ThermoNet/master/data/datasets/Q3214.txt
    local_path: data/raw/thermonet/Q3214.txt
    format: whitespace_table
    entries: 3214
    identifier:
      type: pdb_chain
      column: 0
      layout: "PDB code and chain written together, e.g. 1otrB"
      status: verified
    mutation:
      columns: {position: 1, wt_aa: 2, mut_aa: 3}
      position_basis: pdb_numbering
      position_basis_status: unverified
      position_basis_note: >-
        Positions agree with Pos(PDB) in Q3421, but the file itself documents
        no numbering.
    ddg:
      column: 4
      unit: kcal_per_mol
      unit_status: verified
      convention: positive_destabilizing
      sign_factor: -1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Entry by entry comparison with Q3421 from the same repository. A
          pure sign inversion, the magnitudes are identical.
        numbers:
          shared_entries_q3421: 3214
          same_sign: 0
          opposite_sign: 3165
          equal_magnitude_tolerance_0_011: 3214
          remaining_49: "entries with value 0.0, sign not determinable"
          cross_check_s2648: "1374 shared, 1299 of them opposite"
    ph: {column: null, status: not_available}
    temperature: {column: null, status: not_available}
    notes: >-
      The core finding behind this tool: Q3214 and Q3421 sit in the same
      repository and use opposite signs.

  q1744:
    name: Q1744
    version: "ThermoNet, retrieved 2026-09-07"
    reference: "Li et al. 2020, PLoS Comput Biol 16:e1008291"
    url: https://raw.githubusercontent.com/gersteinlab/ThermoNet/master/data/datasets/Q1744.txt
    local_path: data/raw/thermonet/Q1744.txt
    format: whitespace_table
    entries: 1744
    identifier:
      type: pdb_chain
      column: 0
      status: verified
    mutation:
      columns: {position: 1, wt_aa: 2, mut_aa: 3}
      position_basis: pdb_numbering
      position_basis_status: unverified
    ddg:
      column: 4
      unit: kcal_per_mol
      unit_status: verified
      convention: positive_destabilizing
      sign_factor: -1
      status: verified
      verified:
        date: 2026-09-07
        method: Entry by entry comparison with Q3421 and Q3214.
        numbers:
          shared_entries_q3421: 1744
          opposite_to_q3421: 1730
          equal_magnitude_to_q3421: 1744
          shared_entries_q3214: 1744
          same_sign_as_q3214: 1730
    ph: {column: null, status: not_available}
    temperature: {column: null, status: not_available}
    notes: "Subset of Q3214, same convention."

  ssym:
    name: Ssym
    version: "ThermoNet copy, retrieved 2026-09-07"
    reference: "Pucci et al. 2018, Bioinformatics 34:3659"
    url: https://raw.githubusercontent.com/gersteinlab/ThermoNet/master/data/datasets/s_sym.txt
    local_path: data/raw/thermonet/s_sym.txt
    format: whitespace_table
    entries: 342
    identifier:
      type: pdb_chain
      column: 0
      layout: "column 0 is the wild type chain, column 1 the mutant structure"
      status: verified
    mutation:
      columns: {position: 2, wt_aa: 3, mut_aa: 4}
      position_basis: pdb_numbering
      position_basis_status: unverified
    ddg:
      column: 5
      unit: kcal_per_mol
      unit_status: verified
      convention: positive_destabilizing
      sign_factor: -1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Compared shared entries against S2648. Ssym consists of mutations in
          15 chains, all of which are contained in S2648.
        numbers:
          shared_entries_s2648: 194
          same_sign: 12
          opposite_sign: 179
          raw_distribution: "252 positive, 82 negative"
    ph: {column: null, status: not_available}
    temperature: {column: null, status: not_available}
    notes: >-
      This file holds only the 342 direct mutations. The matching reverse
      mutations are not included.

  s669:
    name: S669
    version: "Zenodo 10.5281/zenodo.7568094, retrieved 2026-09-07"
    reference: "Pancotti et al. 2022, Brief Bioinform 23:bbab555"
    url: https://zenodo.org/records/7568094
    local_path: data/raw/s669/S669.csv
    format: csv
    entries: 669
    identifier:
      type: pdb_chain
      columns: {pdb: WT_PDB, chain: Chain}
      status: verified
    mutation:
      column: PDB_Mut
      alternative_column: Seq_Mut
      layout: "wt_aa + position + mut_aa, e.g. S11A"
      position_basis: pdb_numbering
      position_basis_status: verified
      position_basis_note: >-
        The file carries both numberings. PDB_Mut and Seq_Mut are identical
        for only 336 of 669 entries; ddgnorm uses PDB_Mut to match the
        pdb_chain identifier type.
    ddg:
      column: Experimental_DDG_dir
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Compared shared entries against ThermoMutDB, from which S669 was
          curated.
        numbers:
          shared_entries_thermomutdb: 337
          same_sign: 332
          opposite_sign: 4
          median_magnitude_ratio: 1.000
          raw_distribution: "168 positive, 499 negative"
    ph:
      column: pH
      status: verified
    temperature:
      column: Temperature
      unit: kelvin
      status: verified
      verified:
        date: 2026-09-07
        method: Value range inspected, clearly Kelvin
        numbers: {min: 281.15, median: 298.15, max: 348.05, missing: 8}
    notes: >-
      The file also holds predictions from 19 methods and the column
      Experimental_DDG_inv for the reverse mutations. ddgnorm loads neither.

  thermomutdb:
    name: ThermoMutDB
    version: "v1.3 JSON dump, retrieved 2026-09-07"
    reference: "Xavier et al. 2021, Nucleic Acids Res 49:D475"
    url: https://biosig.lab.uq.edu.au/thermomutdb/static/data/thermomutdb.json
    local_path: data/raw/thermomutdb.json
    format: json_records
    entries: 13337
    entries_used: "11201 single mutations, 8806 of them with a ddG value"
    filter:
      mutation_type: Single
      require_ddg: true
    identifier:
      type: uniprot
      column: uniprot
      fallback:
        type: pdb_chain
        columns: {pdb: PDB_wild, chain: mutated_chain}
      status: verified
      note: >-
        UniProt is present for 13138 of 13337 entries, PDB_wild for 12949.
        Falls back to pdb_chain when UniProt is missing.
    mutation:
      column: mutation_code
      layout: "wt_aa + position + mut_aa, e.g. E49M"
      position_basis: mixed
      position_basis_status: unverified
      position_basis_note: >-
        The mutation_based field says "PDB and Uniprot" or similar per entry.
        There is no reliable way to tell which numbering applies in a given
        case, so the loader warns.
    ddg:
      column: ddg
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Cross-checked against the source's own "effect" field, plus
          comparison with S2648 and S669.
        numbers:
          effect_destabilizing_and_negative: 6316
          effect_stabilizing_and_positive: 2287
          contradictions: 203
          shared_s2648: 1599
          same_sign_s2648: 1510
    ph:
      column: ph
      status: verified
    temperature:
      column: temperature
      unit: kelvin
      status: verified
      verified:
        date: 2026-09-07
        method: Value range inspected
        numbers:
          n: 11971
          kelvin_range: "11968 values between 253.15 and 592.75"
          anomaly: "3 values of exactly 25.0, likely Celsius, are discarded"

  fireprotdb:
    name: FireProtDB
    version: "CSV export via api/search, retrieved 2026-09-07"
    reference: "Stourac et al. 2021, Nucleic Acids Res 49:D319"
    reference_v2: "Musil et al. 2026, Nucleic Acids Res 54, doi 10.1093/nar/gkaf1211"
    url: https://loschmidt.chemi.muni.cz/fireprotdb/api/search?format=csv&sort=
    local_path: data/raw/fireprotdb_ddg_only.csv
    local_path_note: >-
      The local copy holds only the 613208 rows that carry a DDG value, taken
      from the 1.78 GB full export. Columns are unchanged.
    format: csv
    entries: 613208
    identifier:
      type: uniprot
      column: UNIPROTKB
      fallback:
        type: pdb
        column: WWPDB
      second_fallback:
        type: megascale_wt_name
        column: MEGASCALE
      status: verified
      note: >-
        UniProt is present for only 11207 of the 613208 rows with a DDG value.
        The MegaScale rows carry their identifier solely in the MEGASCALE
        column.
    mutation:
      column: SUBSTITUTION
      layout: "wt_aa + position + mut_aa"
      position_basis: unknown
      position_basis_status: unverified
      position_basis_note: >-
        The source does not document whether the position refers to UniProt or
        to PDB numbering, so the loader warns.
    ddg:
      column: DDG
      unit: kcal_per_mol
      unit_status: verified
      convention: mixed_per_subset
      status: verified
      documented_convention:
        value: negative_destabilizing
        note: >-
          Careful: the convention the source documents is not the one its data
          follows throughout. The help page and the 2.0 paper both classify a
          mutation as stabilising below -0.5 kcal/mol and as destabilising
          above 0.5 kcal/mol, which means negative is stabilizing. The
          ProTherm rows follow that. The MegaScale rows do not; they carry the
          convention of their own source, where positive is stabilizing. The
          measured behaviour per subset is what ddgnorm applies, see below.
        evidence:
          date: 2026-09-07
          method: >-
            Applied the documented rule to the MegaScale rows and compared it
            with the Stabilizing column, which the glossary describes as the
            tag taken over from the MegaScale dataset. Tag and rule never
            agree.
          numbers:
            tag_false_but_rule_says_stabilizing: 382527
            tag_true_but_rule_says_destabilizing: 2388
            tag_false_and_rule_says_neutral: 145708
            share_positive_protherm: "68.6 %"
            share_positive_megascale: "15.7 %"
        reported_upstream: >-
          A report to the maintainers was drafted on 2026-09-07. If the import
          is corrected, the MegaScale rows will follow the documented
          convention and the sign_factor of that subset has to change from 1
          to -1. Re-verify against the source table before changing it.
      subsets:
        - match: {column: SOURCE_DATASET, equals: ProTherm}
          rows: 8277
          convention: positive_destabilizing
          sign_factor: -1
          status: verified
          verified:
            date: 2026-09-07
            method: >-
              Compared shared entries against S2648 and against ThermoMutDB on
              PDB, position, wild type and mutant residue.
            numbers:
              shared_s2648: 431
              opposite_s2648: 395
              shared_thermomutdb: 915
              opposite_thermomutdb: 855
              median_magnitude_ratio: 1.000
        - match: {column: SOURCE_DATASET, equals: MegaScale}
          rows: 604920
          convention: negative_destabilizing
          sign_factor: 1
          status: verified
          verified:
            date: 2026-09-07
            method: >-
              Compared against the original table of Tsuboyama 2023 on the
              MEGASCALE identifier and the substitution.
            numbers:
              shared: 332249
              same_sign: 330317
              opposite_sign: 1932
              median_magnitude_ratio: 1.000
        - match: {column: SOURCE_DATASET, equals: COZYME}
          rows: 11
          convention: unknown
          sign_factor: 1
          status: unverified
          note: >-
            Only 11 rows and no overlap with any other source, so nothing can
            be verified. The loader warns and passes the values through
            unchanged.
    ph:
      column: PH
      status: verified
    temperature:
      column: EXP_TEMPERATURE
      unit: celsius
      status: verified
      verified:
        date: 2026-09-07
        method: Value range inspected
        numbers: {n: 7900, min: -15.0, median: 25.0, max: 133.6}
    notes: >-
      Two traps in this source. First the convention differs between its
      subsets, see subsets above. Second there are several measurements per
      mutation with contradictory values, for example 1WQ5 F22L with -2.2 and
      +0.8 in two rows. ddgnorm aggregates nothing and emits both rows.

  megascale:
    name: Megascale (Tsuboyama 2023)
    version: "Zenodo 10.5281/zenodo.7992926, retrieved 2026-09-07"
    reference: "Tsuboyama et al. 2023, Nature 620:434"
    url: https://zenodo.org/records/7992926
    local_path: data/raw/megascale_ddG_slim.csv
    local_path_note: >-
      An eight column reduction of
      Processed_K50_dG_datasets/Tsuboyama2023_Dataset2_Dataset3_20230416.csv.
    format: csv
    entries: 776298
    entries_used: "487914 single mutations, 389068 of them with a ddG value"
    filter:
      mut_type_matches: "^[A-Z][0-9]+[A-Z]$"
      require_ddg: true
    identifier:
      type: megascale_wt_name
      column: WT_name
      status: verified
      note: >-
        479 distinct values, 318 of them shaped like a PDB code, the rest de
        novo designs with no entry in PDB or UniProt. Not a database
        accession, hence its own identifier type.
    mutation:
      column: mut_type
      layout: "wt_aa + position + mut_aa"
      position_basis: sequence_index_1based
      position_basis_status: verified
      position_basis_note: >-
        The position refers to the aa_seq column shipped with each row, one
        based. aa_seq is the mutated sequence.
      verified:
        date: 2026-09-07
        method: "Tested aa_seq[position-1] == mut_aa on the first 60000 rows"
        numbers: {matching: 60000, deviating: 0}
    ddg:
      column: ddG_ML
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Two independent checks. First the source's own Stabilizing_mut
          field. Second the internal relation
          ddG_ML = dG_ML(mutant) - dG_ML(wild type), where dG is folding
          stability and higher values mean more stable.
        numbers:
          stabilizing_mut_true_and_positive: "2112 of 2112"
          median_deviation_ddg_minus_dg_difference: 0.0000
          n_checked: 389068
    ph: {column: null, status: not_available}
    temperature: {column: null, status: not_available}
    notes: >-
      The values come from a proteolysis assay, not from classical unfolding.
      pH and temperature are constant across the dataset and are not recorded
      per row. Sequences ship with every row, which makes this the only source
      where the wild type residue can be checked without an external lookup.

# ---------------------------------------------------------------------------

excluded:
  prothermdb:
    reason: >-
      The bulk download is only available through a form asking for name,
      email, organisation and role. It was not filled in, so format, columns,
      units and sign convention are unknown.
    url: https://web.iitm.ac.in/bioinfo2/prothermdb/Downloads.html
    status: unverified
