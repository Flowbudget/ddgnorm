      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Abgleich gemeinsamer Eintraege mit ThermoMutDB, aus dem S669
          kuratiert wurde.
        numbers:
          gemeinsame_eintraege_thermomutdb: 337
          gleiches_vorzeichen: 332
          entgegengesetzt: 4
          median_betragsverhaeltnis: 1.000
          verteilung_roh: "168 positiv, 499 negativ"
    ph:
      column: pH
      status: verified
    temperature:
      column: Temperature
      unit: kelvin
      status: verified
      verified:
        date: 2026-09-07
        method: Wertebereich geprueft, klar Kelvin
        numbers: {min: 281.15, median: 298.15, max: 348.05, fehlend: 8}
    notes: >-
      Die Datei enthaelt zusaetzlich die Vorhersagen von 19 Methoden sowie
