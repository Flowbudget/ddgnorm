    local_path: data/raw/thermonet/s_sym.txt
    format: whitespace_table
    entries: 342
    identifier:
      type: pdb_chain
      column: 0
      layout: "Spalte 0 ist die Wildtyp-Kette, Spalte 1 die Mutantenstruktur"
      status: verified
    mutation:
      columns: {position: 2, wt_aa: 3, mut_aa: 4}
      position_basis: pdb_numbering
      position_basis_status: unverified
    ddg:
      column: 5
      unit: kcal_per_mol
      unit_status: verified
      convention: positive_destabilizing
      sign_factor: -1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Abgleich gemeinsamer Eintraege mit S2648. Ssym besteht aus
          Mutationen in 15 Ketten, die vollstaendig in S2648 enthalten sind.
        numbers:
          gemeinsame_eintraege_s2648: 194
          gleiches_vorzeichen: 12
          entgegengesetzt: 179
          verteilung_roh: "252 positiv, 82 negativ"
    ph: {column: null, status: not_available}
    temperature: {column: null, status: not_available}
    notes: >-
      Diese Datei enthaelt nur die 342 direkten Mutationen. Die zugehoerigen
