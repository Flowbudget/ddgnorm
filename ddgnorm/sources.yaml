# ddgnorm — kuratierte Konventionstabelle fuer oeffentliche DDG-Datensaetze
#
# Zielkonvention dieses Werkzeugs (siehe target unten):
#   ddg_kcal_mol < 0  =  destabilisierend
#   ddg_kcal_mol > 0  =  stabilisierend
#   Einheit kcal/mol
#
# sign_factor ist der Faktor, mit dem der Rohwert multipliziert wird, um in die
# Zielkonvention zu kommen. +1 = Quelle stimmt bereits ueberein, -1 = umdrehen.
#
# Jede Konvention hat einen Block "verified" mit Methode, Datum und Zahlen.
# Was nicht so belegt werden konnte, traegt status: unverified. Der Loader
# warnt fuer jedes Feld mit status: unverified.
#
# Alle Pruefungen am 2026-09-07 auf den Dateien unter data/raw ausgefuehrt.
# Belege im Detail: DATENLAGE.md.

schema_version: 1

target:
  sign_convention: negative_destabilizing
  unit: kcal_per_mol
  columns:
    - source
    - protein_id
    - id_type
    - position
    - wt_aa
    - mut_aa
    - ddg_kcal_mol
    - ph
    - temperature
  temperature_unit: celsius
  notes: >-
    Temperatur wird auf Grad Celsius vereinheitlicht, weil die Mehrzahl der
    Quellen Celsius liefert. Quellen in Kelvin werden umgerechnet
    (siehe temperature.unit je Quelle).

# ---------------------------------------------------------------------------

sources:

  s2648:
    name: S2648
    version: "protddg-bench, Abruf 2026-09-07"
    reference: "Dehouck et al. 2009, Bioinformatics 25:2537"
    url: https://github.com/protddg-bench/protddg-bench/tree/master/S2648
    local_path: data/raw/protddg/s2648-10fold-split-0.json
    format: json_records
    entries: 2648
    identifier:
      type: pdb_chain
      column: PDB
      layout: "vier Zeichen PDB-Code plus ein Zeichen Kette, z. B. 1A5EA"
      status: verified
    mutation:
      column: MUT
      layout: "wt_aa + Position + mut_aa in einem Feld, z. B. W15D"
      position_basis: pdb_numbering
      position_basis_status: unverified
      position_basis_note: >-
        Die Liste stammt aus PDB-basierten Arbeiten und die Nummerierung
        stimmt bei Stichproben mit der PDB-Nummerierung ueberein, es gibt
        aber keine Aussage in der Quelle selbst.
    ddg:
      column: DDG
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Abgleich gemeinsamer Eintraege (PDB, Position, WT-AS, Mut-AS) mit
          ThermoMutDB, dessen Konvention ueber das eigene Feld "effect"
          unabhaengig festliegt.
        numbers:
          gemeinsame_eintraege_thermomutdb: 1599
          gleiches_vorzeichen: 1510
          entgegengesetzt: 56
          median_betragsverhaeltnis: 1.000
          verteilung_roh: "568 positiv, 2046 negativ, Median -0.82"
    ph:
      column: pH
      status: verified
    temperature:
      column: T
      unit: celsius
      status: verified
      verified:
        date: 2026-09-07
        method: Wertebereich geprueft
        numbers: {min: 0.0, median: 25.0, max: 107.0}
    notes: >-
      Das Feld CLID ist eine bereits mitgelieferte Homologie-Cluster-Kennung
      mit 113 verschiedenen Werten. Wird von ddgnorm nicht verwendet.

