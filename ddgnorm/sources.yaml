  thermomutdb:
    name: ThermoMutDB
    version: "v1.3 JSON-Abzug, Abruf 2026-09-07"
    reference: "Xavier et al. 2021, Nucleic Acids Res 49:D475"
    url: https://biosig.lab.uq.edu.au/thermomutdb/static/data/thermomutdb.json
    local_path: data/raw/thermomutdb.json
    format: json_records
    entries: 13337
    entries_used: "11201 Einzelmutationen, davon 8806 mit DDG"
    filter:
      mutation_type: Single
      require_ddg: true
    identifier:
      type: uniprot
      column: uniprot
      fallback:
        type: pdb_chain
        columns: {pdb: PDB_wild, chain: mutated_chain}
      status: verified
      note: >-
        UniProt bei 13138 von 13337 Eintraegen vorhanden, PDB_wild bei 12949.
        Faellt auf pdb_chain zurueck, wenn UniProt fehlt.
    mutation:
      column: mutation_code
      layout: "wt_aa + Position + mut_aa, z. B. E49M"
      position_basis: mixed
      position_basis_status: unverified
      position_basis_note: >-
        Das Feld mutation_based sagt je Eintrag "PDB and Uniprot" oder
        Aehnliches. Es gibt keine verlaessliche Zuordnung, welche
        Nummerierung im Einzelfall gilt. Der Loader warnt.
    ddg:
      column: ddg
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Gegenprobe mit dem quelleneigenen Feld "effect", zusaetzlich
          Abgleich mit S2648 und S669.
        numbers:
          effect_destabilizing_und_negativ: 6316
          effect_stabilizing_und_positiv: 2287
          widersprueche: 203
          gemeinsam_s2648: 1599
          gleiches_vorzeichen_s2648: 1510
    ph:
      column: ph
      status: verified
    temperature:
      column: temperature
      unit: kelvin
      status: verified
      verified:
        date: 2026-09-07
        method: Wertebereich geprueft
        numbers:
          n: 11971
          kelvin_bereich: "11968 Werte zwischen 253.15 und 592.75"
          auffaellig: "3 Werte von genau 25.0, vermutlich Celsius, werden verworfen"

  fireprotdb:
    name: FireProtDB
    version: "CSV-Export ueber api/search, Abruf 2026-09-07"
    reference: "Stourac et al. 2021, Nucleic Acids Res 49:D319"
    url: https://loschmidt.chemi.muni.cz/fireprotdb/api/search?format=csv&sort=
    local_path: data/raw/fireprotdb_ddg_only.csv
    local_path_note: >-
      Lokal liegen nur die 613208 Zeilen mit DDG-Wert aus dem
      1.78 GB grossen Vollexport. Spalten unveraendert.
    format: csv
    entries: 613208
    identifier:
      type: uniprot
      column: UNIPROTKB
      fallback:
        type: pdb
        column: WWPDB
      second_fallback:
        type: megascale_wt_name
        column: MEGASCALE
      status: verified
      note: >-
        UniProt nur bei 11207 der 613208 DDG-Zeilen. Die MegaScale-Zeilen
        tragen ihre Kennung ausschliesslich in der Spalte MEGASCALE.
    mutation:
      column: SUBSTITUTION
      layout: "wt_aa + Position + mut_aa"
      position_basis: unknown
      position_basis_status: unverified
      position_basis_note: >-
        Die Quelle dokumentiert nicht, ob die Position auf UniProt- oder
        PDB-Nummerierung beruht. Der Loader warnt.
    ddg:
      column: DDG
      unit: kcal_per_mol
      unit_status: verified
      convention: mixed_per_subset
      status: verified
      subsets:
        - match: {column: SOURCE_DATASET, equals: ProTherm}
          rows: 8277
          convention: positive_destabilizing
          sign_factor: -1
          status: verified
          verified:
            date: 2026-09-07
            method: >-
              Abgleich gemeinsamer Eintraege mit S2648 und mit ThermoMutDB
              ueber PDB, Position, WT-AS und Mut-AS.
            numbers:
              gemeinsam_s2648: 431
              entgegengesetzt_s2648: 395
              gemeinsam_thermomutdb: 915
              entgegengesetzt_thermomutdb: 855
              median_betragsverhaeltnis: 1.000
        - match: {column: SOURCE_DATASET, equals: MegaScale}
          rows: 604920
          convention: negative_destabilizing
          sign_factor: 1
          status: verified
          verified:
            date: 2026-09-07
            method: >-
              Abgleich mit der Originaltabelle von Tsuboyama 2023 ueber
              MEGASCALE-Kennung und Substitution.
            numbers:
              gemeinsam: 332249
              gleiches_vorzeichen: 330317
              entgegengesetzt: 1932
              median_betragsverhaeltnis: 1.000
        - match: {column: SOURCE_DATASET, equals: COZYME}
          rows: 11
          convention: unknown
          sign_factor: 1
          status: unverified
          note: >-
            Nur 11 Zeilen, keine Ueberschneidung mit einer anderen Quelle,
            daher nicht pruefbar. Der Loader warnt und laesst den Wert
            unveraendert.
    ph:
      column: PH
      status: verified
    temperature:
      column: EXP_TEMPERATURE
      unit: celsius
      status: verified
      verified:
        date: 2026-09-07
        method: Wertebereich geprueft
        numbers: {n: 7900, min: -15.0, median: 25.0, max: 133.6}
    notes: >-
      Zwei Fallen in dieser Quelle. Erstens die uneinheitliche Konvention
      zwischen den Teilmengen, siehe subsets. Zweitens mehrere Messungen je
      Mutation mit widerspruechlichen Werten, Beispiel 1WQ5 F22L mit -2.2
      und +0.8 in zwei Zeilen. ddgnorm fasst nichts zusammen und gibt beide
      Zeilen aus.

  megascale:
    name: Megascale (Tsuboyama 2023)
    version: "Zenodo 10.5281/zenodo.7992926, Abruf 2026-09-07"
    reference: "Tsuboyama et al. 2023, Nature 620:434"
    url: https://zenodo.org/records/7992926
    local_path: data/raw/megascale_ddG_slim.csv
    local_path_note: >-
      Auf acht Spalten reduzierte Fassung von
      Processed_K50_dG_datasets/Tsuboyama2023_Dataset2_Dataset3_20230416.csv.
    format: csv
    entries: 776298
    entries_used: "487914 Einzelmutationen, davon 389068 mit ddG_ML"
    filter:
      mut_type_matches: "^[A-Z][0-9]+[A-Z]$"
      require_ddg: true
    identifier:
      type: megascale_wt_name
      column: WT_name
      status: verified
      note: >-
        479 verschiedene Werte, davon 318 in der Form eines PDB-Codes, der
        Rest de-novo-Designs ohne Eintrag in PDB oder UniProt. Kein
        Datenbank-Akzessionscode, deshalb ein eigener Identifikatortyp.
    mutation:
      column: mut_type
      layout: "wt_aa + Position + mut_aa"
      position_basis: sequence_index_1based
      position_basis_status: verified
      position_basis_note: >-
        Position bezieht sich auf die mitgelieferte Spalte aa_seq, und zwar
        1-basiert. aa_seq ist die mutierte Sequenz.
      verified:
        date: 2026-09-07
        method: "Test aa_seq[position-1] == mut_aa an den ersten 60000 Zeilen"
        numbers: {uebereinstimmend: 60000, abweichend: 0}
    ddg:
      column: ddG_ML
      unit: kcal_per_mol
      unit_status: verified
      convention: negative_destabilizing
      sign_factor: 1
      status: verified
      verified:
        date: 2026-09-07
        method: >-
          Zwei unabhaengige Pruefungen. Erstens das quelleneigene Feld
          Stabilizing_mut. Zweitens die interne Rechnung
          ddG_ML = dG_ML(Mutante) - dG_ML(Wildtyp), wobei dG die
          Faltungsstabilitaet ist und hoehere Werte stabiler bedeuten.
        numbers:
          stabilizing_mut_true_und_positiv: "2112 von 2112"
          median_abweichung_ddg_minus_dg_differenz: 0.0000
          n_geprueft: 389068
    ph: {column: null, status: not_available}
    temperature: {column: null, status: not_available}
    notes: >-
      Die Werte stammen aus einem Proteolyse-Assay, nicht aus klassischer
      Entfaltung. pH und Temperatur sind im Datensatz konstant und werden
      nicht je Zeile gefuehrt. Sequenz liegt je Zeile bei, deshalb ist diese
      Quelle die einzige, bei der die Wildtyp-Aminosaeure ohne externen
      Abruf pruefbar ist.

# ---------------------------------------------------------------------------

excluded:
  prothermdb:
    reason: >-
      Bulk-Download nur ueber ein Formular mit Name, E-Mail, Organisation und
      Funktion. Nicht ausgefuellt, daher sind Format, Spalten, Einheiten und
      Vorzeichenkonvention unbekannt.
    url: https://web.iitm.ac.in/bioinfo2/prothermdb/Downloads.html
    status: unverified
