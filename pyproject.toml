[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddgnorm"
version = "0.1.0"
description = "Vereinheitlicht oeffentliche DDG-Datensaetze zur Proteinstabilitaet (Vorzeichen, Einheiten, Identifikatoren)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ddgnorm = "ddgnorm.cli:main"

[tool.setuptools]
packages = ["ddgnorm"]

[tool.setuptools.package-data]
ddgnorm = ["sources.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
